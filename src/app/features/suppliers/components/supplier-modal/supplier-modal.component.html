<div *ngIf="isVisible" class="fixed inset-0 z-999999 flex items-center justify-center p-4 bg-gray-900/50 backdrop-blur-sm">
  <div class="w-full max-w-md overflow-hidden bg-white rounded-2xl shadow-xl dark:bg-gray-900 border dark:border-white/[0.1]">
    <div class="px-6 py-4 border-b border-gray-100 dark:border-white/[0.05] flex items-center justify-between">
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white">{{ supplier ? 'Edit Supplier' : 'Add New Supplier' }}</h3>
      <button (click)="onClose()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <form [formGroup]="supplierForm" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
      <div>
        <label class="flex items-center justify-between mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">
          Supplier Name
          <span *ngIf="isFieldModified('nameSupplier')" class="text-[10px] font-semibold uppercase tracking-wider text-brand-500 bg-brand-50 px-1.5 py-0.5 rounded-full dark:bg-brand-500/10">Modified</span>
        </label>
        <input
          formControlName="nameSupplier"
          type="text"
          placeholder="e.g. Global Oil"
          class="w-full px-4 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none dark:bg-gray-800 dark:border-gray-700 dark:text-white"
          [class.border-error-500]="supplierForm.get('nameSupplier')?.touched && supplierForm.get('nameSupplier')?.invalid"
        />
      </div>

      <div>
        <label class="flex items-center justify-between mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">
          Email Address
          <span *ngIf="isFieldModified('email')" class="text-[10px] font-semibold uppercase tracking-wider text-brand-500 bg-brand-50 px-1.5 py-0.5 rounded-full dark:bg-brand-500/10">Modified</span>
        </label>
        <input
          formControlName="email"
          type="email"
          placeholder="email@example.com"
          class="w-full px-4 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none dark:bg-gray-800 dark:border-gray-700 dark:text-white"
          [class.border-error-500]="supplierForm.get('email')?.touched && supplierForm.get('email')?.invalid"
        />
      </div>

      <div>
        <label class="flex items-center justify-between mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">
          Phone
          <span *ngIf="isFieldModified('phone')" class="text-[10px] font-semibold uppercase tracking-wider text-brand-500 bg-brand-50 px-1.5 py-0.5 rounded-full dark:bg-brand-500/10">Mod.</span>
        </label>
        <input
          formControlName="phone"
          type="text"
          placeholder="+212612345678"
          class="w-full px-4 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none dark:bg-gray-800 dark:border-gray-700 dark:text-white"
          [class.border-error-500]="supplierForm.get('phone')?.touched && supplierForm.get('phone')?.invalid"
        />
        <p *ngIf="supplierForm.get('phone')?.touched && supplierForm.get('phone')?.invalid" class="mt-1 text-xs text-error-500">
          Use format: +212612345678 or 0612345678
        </p>
      </div>

      <div *ngIf="supplier?.imageUrl" class="flex items-center gap-3 p-3 border rounded-lg bg-gray-50 dark:bg-gray-800 dark:border-gray-700">
        <img [src]="supplier?.imageUrl" alt="Current Logo" class="w-12 h-12 rounded-full object-cover">
        <div>
          <p class="text-xs font-medium text-gray-700 dark:text-gray-300">Current Logo</p>
          <p class="text-[10px] text-gray-500">Will be replaced if you upload a new one</p>
        </div>
      </div>

      <div>
        <label class="mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">Supplier Logo</label>
        <app-input-field
          type="file"
          id="supplier-logo"
          (fileChange)="onFileChange($event)"
          hint="SVG, PNG, JPG or GIF (max. 800x400px)"
        ></app-input-field>
      </div>

      <div class="flex items-center justify-end gap-3 pt-4">
        <app-button variant="outline" size="sm" (btnClick)="onClose()" type="button">Cancel</app-button>
        <app-button variant="primary" size="sm" type="submit">{{ supplier ? 'Update Supplier' : 'Save Supplier' }}</app-button>
      </div>
    </form>
  </div>
</div>
