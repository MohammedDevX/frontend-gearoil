<div class="tracking-page py-12 bg-gray-50 min-h-screen">
  <div class="container mx-auto px-4">
    <div class="flex flex-col lg:flex-row gap-8">
      
      <!-- Tracking Map -->
      <div class="flex-1 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <h1 class="text-2xl font-bold mb-4">Track your Delivery</h1>
        <div id="tracking-map" class="w-full h-[500px] rounded-lg"></div>
      </div>

      <!-- Info Sidebar -->
      <div class="lg:w-1/3 space-y-6">
        <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
          <h2 class="text-xl font-bold mb-4">Delivery Status</h2>
          <div class="flex items-center space-x-4 mb-6">
            <div class="w-12 h-12 bg-brand-100 rounded-full flex items-center justify-center text-brand-600">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0" />
              </svg>
            </div>
            <div>
              <p class="text-sm text-gray-500 uppercase font-semibold">Estimated Arrival</p>
              <p class="text-2xl font-bold text-gray-800">{{ eta }}</p>
            </div>
          </div>

          <div class="border-t border-gray-100 pt-6">
            <h3 class="font-bold mb-2">Delivery Address</h3>
            <p class="text-gray-600">{{ livraison?.address }}</p>
          </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
          <h3 class="font-bold mb-4">Order #{{ livraison?.orderId }}</h3>
          <div class="flex justify-between items-center">
            <span class="text-gray-500 text-sm">Status</span>
            <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-bold uppercase">
              {{ livraison?.status }}
            </span>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
