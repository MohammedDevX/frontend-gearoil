<div class="container account-page">

  <div class="row justify-content-center">

    <div class="col-lg-8">

      <div class="account-card">

        <div class="account-card-title">
          Edit Profile
        </div>

        @if (facade.error()) {
          <div class="alert alert-danger" style="margin: 0.5rem 1.5rem; padding: 0.5rem 1rem;">
            {{ facade.error() }}
          </div>
        }

        <form class="account-card-body" [formGroup]="profileForm" (ngSubmit)="onSave()">

          <div class="form-group">
            <label>First Name</label>
            <input type="text" formControlName="Prenom" placeholder="First Name">
          </div>

          <div class="form-group">
            <label>Last Name</label>
            <input type="text" formControlName="Nom" placeholder="Last Name">
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <input type="email" formControlName="Email" placeholder="Email Address">
          </div>

          <div class="form-group">
            <label>Username</label>
            <input type="text" formControlName="UserName" placeholder="Username">
          </div>

          <button type="submit" class="btn-save" [disabled]="profileForm.invalid || facade.isLoading()">
            {{ facade.isLoading() ? 'Saving...' : 'Save' }}
          </button>

        </form>

      </div>

    </div>

  </div>

</div>
