<div class="rounded-2xl border border-gray-200 bg-white pt-4 dark:border-white/[0.05] dark:bg-white/[0.03]">
  <div class="mb-4 flex flex-col gap-4 px-5 sm:flex-row sm:items-center sm:justify-between sm:px-6">
    <div>
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">Products</h3>
    </div>
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
      <form>
        <div class="relative">
          <button class="absolute -translate-y-1/2 left-4 top-1/2" type="button">
            <svg class="fill-gray-500 dark:fill-gray-400" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M3.04199 9.37381C3.04199 5.87712 5.87735 3.04218 9.37533 3.04218C12.8733 3.04218 15.7087 5.87712 15.7087 9.37381C15.7087 12.8705 12.8733 15.7055 9.37533 15.7055C5.87735 15.7055 3.04199 12.8705 3.04199 9.37381ZM9.37533 1.54218C5.04926 1.54218 1.54199 5.04835 1.54199 9.37381C1.54199 13.6993 5.04926 17.2055 9.37533 17.2055C11.2676 17.2055 13.0032 16.5346 14.3572 15.4178L17.1773 18.2381C17.4702 18.531 17.945 18.5311 18.2379 18.2382C18.5308 17.9453 18.5309 17.4704 18.238 17.1775L15.4182 14.3575C16.5367 13.0035 17.2087 11.2671 17.2087 9.37381C17.2087 5.04835 13.7014 1.54218 9.37533 1.54218Z" fill="currentColor"></path></svg>
          </button>
          <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()" name="searchForm" placeholder="Search products..." class="dark:bg-dark-900 h-[42px] w-full rounded-lg border border-gray-300 bg-transparent py-2.5 pl-[42px] pr-4 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800 xl:w-[300px]" />
        </div>
      </form>
      <app-button routerLink="/admin/products/add">
        <span class="flex items-center gap-2">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Add Product
        </span>
      </app-button>
    </div>
  </div>

  <div class="overflow-hidden">
    <div class="max-w-full overflow-x-auto px-5 sm:px-6">
      <table class="min-w-full">
        <thead class="border-y border-gray-100 dark:border-white/[0.05]">
          <tr>
            <th class="py-3 px-4 text-start text-theme-sm font-normal text-gray-500 dark:text-gray-400">Name</th>
            <th class="px-4 py-3 text-start text-theme-sm font-normal text-gray-500 dark:text-gray-400">SKU</th>
            <th class="px-4 py-3 text-start text-theme-sm font-normal text-gray-500 dark:text-gray-400">Category</th>
            <th class="px-4 py-3 text-start text-theme-sm font-normal text-gray-500 dark:text-gray-400">Volume</th>
            <th class="px-4 py-3 text-start text-theme-sm font-normal text-gray-500 dark:text-gray-400">Status</th>
            <th class="px-4 py-3 text-start text-theme-sm font-normal text-gray-500 dark:text-gray-400"><span class="sr-only">Action</span></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 dark:divide-white/[0.05]">
          <tr *ngFor="let item of currentItems; let i = index">
            <td class="py-4 px-4">
              <div class="flex items-center gap-3">
                <div class="h-10 w-10 flex-shrink-0 overflow-hidden rounded-md border border-gray-100 dark:border-white/[0.05]">
                  <img [src]="item.urlImage || 'assets/images/product/product-placeholder.png'" [alt]="item.name" class="h-full w-full object-cover object-center" />
                </div>
                <span class="block text-theme-sm font-medium text-gray-700 dark:text-gray-400">{{ item.name }}</span>
              </div>
            </td>
            <td class="px-4 py-4 text-theme-sm text-gray-700 dark:text-gray-400">{{ item.sku }}</td>
            <td class="px-4 py-4 text-theme-sm text-gray-700 dark:text-gray-400">
               <span class="capitalize">{{ item.category }}</span>
            </td>
            <td class="px-4 py-4 text-theme-sm text-gray-700 dark:text-gray-400">{{ item.volume ? item.volume + ' L' : '-' }}</td>
            <td class="px-4 py-4 text-theme-sm text-gray-700 dark:text-gray-400">
              <app-badge size="sm" [color]="item.isActive ? 'success' : 'error'">
                {{ item.isActive ? 'Active' : 'Inactive' }}
              </app-badge>
            </td>
            <td class="px-4 py-4 text-theme-sm text-gray-700 dark:text-gray-400">
              <div class="flex items-center gap-3">
                <button [routerLink]="['/admin/products', item.id, 'edit']" class="text-gray-500 hover:text-brand-500 dark:text-gray-400 dark:hover:text-brand-400 transition-colors" title="Edit">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                </button>
                <button (click)="deleteProduct(item.id)" class="text-gray-500 hover:text-error-500 dark:text-gray-400 dark:hover:text-error-400 transition-colors" title="Delete">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="border-t border-gray-200 px-6 py-4 dark:border-white/[0.05]">
    <div class="flex items-center justify-between">
      <app-button size="sm" variant="outline" (btnClick)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">
        <span class="hidden sm:inline">Previous</span>
      </app-button>
      
      <div class="flex items-center justify-center gap-1">
         <button *ngFor="let p of pages" (click)="goToPage(p)" class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-medium transition-colors" [ngClass]="p === currentPage ? 'bg-brand-500 text-white' : 'text-gray-600 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800'">
            {{ p }}
         </button>
      </div>

      <app-button (btnClick)="goToPage(currentPage + 1)" size="sm" variant="outline" [disabled]="currentPage === totalPages">
        <span class="hidden sm:inline">Next</span>
      </app-button>
    </div>
  </div>
</div>
