<div class="checkout-page py-12 bg-gray-50 min-h-screen">
  <div class="container mx-auto px-4 max-w-4xl">
    <h1 class="text-3xl font-bold mb-8 text-gray-800">Checkout - Delivery Details</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Form Section -->
      <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-xl font-bold mb-6">Where should we deliver?</h2>
        
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Delivery Date</label>
            <input type="datetime-local" [(ngModel)]="deliveryDate" 
                   class="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
            <select [(ngModel)]="city" 
                    class="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
              <option value="Casablanca">Casablanca</option>
              <option value="Rabat">Rabat</option>
              <option value="Marrakech">Marrakech</option>
              <option value="Oujda">Oujda</option>
              <option value="Tanger">Tanger</option>
              <option value="Agadir">Agadir</option>
              <option value="Fes">Fes</option>
              <option value="Meknes">Meknes</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Full Address</label>
            <textarea [(ngModel)]="address" rows="3" 
                      class="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none"
                      placeholder="Street name, building number..."></textarea>
          </div>

          <div class="pt-4">
            <button (click)="confirmOrder()" 
                    class="w-full bg-brand-500 text-white py-4 rounded-xl font-bold hover:bg-brand-600 transition-colors shadow-lg">
              Confirm Delivery & Pay
            </button>
          </div>
        </div>
      </div>

      <!-- Map Section -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col">
        <h2 class="text-xl font-bold mb-4 px-4">Pin your location</h2>
        <div id="map" class="flex-1 rounded-lg min-h-[400px]"></div>
        <p class="text-xs text-gray-500 mt-2 px-4 italic">Drag the marker or click on the map to set your exact location.</p>
      </div>
    </div>
  </div>
</div>
