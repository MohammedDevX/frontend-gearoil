<div class="block-space block-space--layout--after-header"></div>
<div class="block">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="card p-4 shadow-sm border-0 reset-card">
          <div class="card-body">
            <h2 class="card-title text-center mb-1">Reset Password</h2>
            <p class="text-muted text-center mb-4 small">
              Choose a new password for your account
            </p>

            <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
              <div class="form-group mb-3">
                <label for="reset-email">Email</label>
                <input
                  id="reset-email"
                  type="email"
                  class="form-control"
                  [value]="email"
                  disabled
                />
              </div>

              <div class="form-group mb-3">
                <label for="reset-password">New Password</label>
                <input
                  id="reset-password"
                  type="password"
                  class="form-control"
                  formControlName="newPassword"
                  placeholder="Enter your new password"
                  [ngClass]="{ 'is-invalid': submitted && f['newPassword'].errors }"
                />
                <div
                  *ngIf="submitted && f['newPassword'].errors"
                  class="invalid-feedback text-danger mt-1 small"
                >
                  <div *ngIf="f['newPassword'].errors['required']">
                    Password is required
                  </div>
                  <div *ngIf="f['newPassword'].errors['minlength']">
                    Password must be at least 6 characters
                  </div>
                </div>
              </div>

              <div class="form-group mb-4">
                <label for="reset-confirm-password">Confirm New Password</label>
                <input
                  id="reset-confirm-password"
                  type="password"
                  class="form-control"
                  formControlName="confirmPassword"
                  placeholder="Confirm your new password"
                  [ngClass]="{
                    'is-invalid':
                      submitted &&
                      (f['confirmPassword'].errors ||
                        resetForm.errors?.['passwordMismatch'])
                  }"
                />
                <div
                  *ngIf="
                    submitted &&
                    (f['confirmPassword'].errors ||
                      resetForm.errors?.['passwordMismatch'])
                  "
                  class="invalid-feedback text-danger mt-1 small"
                >
                  <div *ngIf="f['confirmPassword'].errors?.['required']">
                    Confirmation is required
                  </div>
                  <div *ngIf="resetForm.errors?.['passwordMismatch']">
                    Passwords do not match
                  </div>
                </div>
              </div>

              <div class="form-group mb-3">
                <button type="submit" class="btn btn-primary w-100 shadow-sm border-0 py-2">
                  Update Password
                </button>
              </div>

              <div class="mt-4 text-center small text-muted">
                Remembered your password?
                <a routerLink="/login" class="text-danger fw-bold text-decoration-none">Login</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="block-space block-space--layout--before-footer"></div>
