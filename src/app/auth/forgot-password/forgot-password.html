<div class="block-space block-space--layout--after-header"></div>
<div class="block">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="card p-4 shadow-sm border-0 forgot-card">
          <div class="card-body">
            <h2 class="card-title text-center mb-1">Forgot Password</h2>
            <p class="text-muted text-center mb-4 small">Enter your email to receive a reset link</p>

            <div *ngIf="emailSentStatus" class="alert alert-success border-0 shadow-sm text-center py-3">
              <i class="fas fa-check-circle mr-2"></i>
              Check your inbox! We've sent you a reset link.
            </div>

            <form *ngIf="!emailSentStatus" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
              <div class="form-group mb-4">
                <label for="forgot-email">Email Address</label>
                <input id="forgot-email" type="email" class="form-control" formControlName="Email"
                  placeholder="customer@example.com" [ngClass]="{ 'is-invalid': submitted && f['Email'].errors }">
                <div *ngIf="submitted && f['Email'].errors" class="invalid-feedback text-danger mt-1 small">
                  <div *ngIf="f['Email'].errors['required']">Email is required</div>
                  <div *ngIf="f['Email'].errors['email']">Enter a valid email address</div>
                </div>
              </div>

              <div class="form-group mb-4">
                <button type="submit"
                  class="btn btn-primary w-100 shadow-sm border-0 py-2 d-flex justify-content-center align-items-center"
                  [disabled]="loading" style="transition: all 0.3s ease;">
                  <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"
                    aria-hidden="true"></span>
                  <span *ngIf="loading">Sending Reset Link...</span>
                  <span *ngIf="!loading">Send Reset Link</span>
                </button>
              </div>

              <div class="mt-4 text-center small text-muted">
                Wait, I remember my password!
                <a routerLink="/login" class="text-danger fw-bold text-decoration-none">Login</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="block-space block-space--layout--before-footer"></div>
