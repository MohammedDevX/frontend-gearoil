<div class="card">
    <div class="form-title">Activer le compte</div>
    <div class="form-sub">Définissez votre mot de passe pour accéder à la plateforme.</div>
  
    <div class="set-pw-info">
      Lien reçu par email. <strong>Token valide 24h.</strong>
    </div>
  
    <div class="field">
      <label>Nouveau mot de passe</label>
      <input type="password" [(ngModel)]="password" placeholder="Min. 6 car., 1 maj., 1 chiffre, 1 spécial" />
    </div>
  
    <button class="btn-primary" (click)="setPassword()">Activer le compte</button>
  </div>
