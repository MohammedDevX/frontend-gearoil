<div class="product-card product-card--layout--grid">
    <div class="product-card__image">
        <div class="image image--type--product">
            <a [routerLink]="['/detail', product.id]" class="image__body">
                <img
                    class="image__tag"
                    [src]="product.urlImage || 'images/products/product-1-245x245.jpg'"
                    [alt]="product.name"
                />
            </a>
        </div>
    </div>
    <div class="product-card__info">
        <div class="product-card__name">
            <div>
                <div class="product-card__badges"></div>
                <div class="product-card__sku" style="font-size: 13px; color: #a1a1a1; margin-bottom: 4px;">
                    SKU: {{ product.sku || 'N/A' }}
                </div>
                <a [routerLink]="['/detail', product.id]">{{ product.name }}</a>
            </div>
        </div>
        <div class="product-card__rating">
            <div class="rating product-card__rating-stars">
                <div class="rating__body">
                    @for (active of stars; track $index) {
                        <div
                            class="rating__star"
                            [class.rating__star--active]="active"
                        ></div>
                    }
                </div>
            </div>
            <div class="product-card__rating-label">
                {{ product.averageRating | number:'1.0-1' }} on {{ product.reviewsCount || 0 }} reviews
            </div>
        </div>
    </div>
    <div class="product-card__footer">
        <div class="product-card__prices">
            <div class="product-card__price product-card__price--current">
                {{ product.price | currency:'USD':'symbol':'1.2-2' }}
            </div>
        </div>
        <button
            class="product-card__addtocart-icon"
            type="button"
            aria-label="Add to cart"
            [disabled]="isAddingToCart"
            (click)="addToCart()">
            <svg width="20" height="20">
                <circle cx="7" cy="17" r="2" />
                <circle cx="15" cy="17" r="2" />
                <path d="M20,4.4V5l-1.8,6.3c-0.1,0.4-0.5,0.7-1,0.7H6.7c-0.4,0-0.8-0.3-1-0.7L3.3,3.9C3.1,3.3,2.6,3,2.1,3H0.4C0.2,3,0,2.8,0,2.6
    V1.4C0,1.2,0.2,1,0.4,1h2.5c1,0,1.8,0.6,2.1,1.6L5.1,3l2.3,6.8c0,0.1,0.2,0.2,0.3,0.2h8.6c0.1,0,0.3-0.1,0.3-0.2l1.3-4.4
    C17.9,5.2,17.7,5,17.5,5H9.4C9.2,5,9,4.8,9,4.6V3.4C9,3.2,9.2,3,9.4,3h9.2C19.4,3,20,3.6,20,4.4z" />
            </svg>
        </button>
    </div>
</div>
